[package]
name = "kova"
version = "0.1.0"
edition = "2024"
description = "A compiled language with strict types and ownership without a garbage collector"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Thibault-Savenkoff/kova"

[dependencies]
# Every system `kova build --target` knows: x86-64 and arm64.
cranelift-codegen = { version = "=0.137.0", features = ["x86", "arm64"] }
cranelift-frontend = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-object = "=0.137.0"
# `sin`, `pow`… for `kova run` and the runtime alike (src/shared.rs `math`, build.rs): musl's maths
# in Rust, without the processor's own instructions (`arch`), so the same digits everywhere.
libm = { version = "=0.2.16", default-features = false }
lsp-server = "0.10"
# Reading the objects for Kova's own linker (src/link.rs); already used by cranelift-object.
object = { version = "0.40", default-features = false, features = ["read_core", "archive", "elf", "coff", "macho", "std"] }
lsp-types = "0.97"
serde_json = "1"
target-lexicon = "0.13.5"

[build-dependencies]
# Keeping only the runtime's objects an executable can reach (build.rs).
object = { version = "0.40", default-features = false, features = ["read_core", "archive", "elf", "coff", "macho", "std"] }

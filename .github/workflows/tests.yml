# The tests on the systems this machine is not: started by hand (`gh workflow run tests.yml`),
# since a Mac minute counts ten (PLAN Part 4 "Kova without a C compiler").
name: tests
on: workflow_dispatch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm, macos-15-intel, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # The runtimes of the other systems, for `kova build --target` (build.rs).
      - run: rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
        env:
          KOVA_LANG: en
      # `DateTime.now` reads the last rule of the time zone file (src/shared.rs `local_offset`):
      # the hour must be the one `date` gives, in run and in build.
      - if: runner.os == 'macOS'
        run: |
          printf 'fn main {\n    print(DateTime.now.hour)\n}\n' > now.kova
          cargo run -q --locked -- build now.kova -o now
          for tz in "" Europe/Paris Australia/Sydney America/New_York Asia/Kathmandu; do
            want=$(TZ=$tz date +%-H); run=$(TZ=$tz cargo run -q --locked -- run now.kova); built=$(TZ=$tz ./now)
            echo "TZ=$tz: date $want, run $run, build $built"
            [ "$want" = "$run" ] && [ "$want" = "$built" ]
          done

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kova documentation</title>
<style>
:root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d8dee4; --code:#f6f8fa; --accent:#0a6cff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --code:#161b22; --accent:#58a6ff; } }
:root[data-theme="dark"] { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --code:#161b22; --accent:#58a6ff; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui, sans-serif; }
nav { position:fixed; inset:0 auto 0 0; width:260px; overflow:auto; padding:20px 16px; border-right:1px solid var(--line); }
nav h1 { font-size:1.3rem; margin:0 0 12px; }
nav input { width:100%; padding:6px 8px; margin-bottom:12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
nav a { display:block; padding:3px 8px; color:var(--muted); text-decoration:none; border-radius:6px; font-size:.93rem; }
nav a:hover, nav a.on { color:var(--fg); background:var(--code); }
main { margin-left:260px; padding:32px clamp(16px,4vw,56px) 80px; max-width:60rem; }
h1,h2,h3 { line-height:1.25; } h2 { margin-top:2.6rem; padding-top:.6rem; border-top:1px solid var(--line); }
a { color:var(--accent); }
pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow:auto; font-size:.88rem; line-height:1.5; }
code { background:var(--code); border-radius:4px; padding:.1em .35em; font:.88em ui-monospace, Menlo, Consolas, monospace; }
pre code { background:none; padding:0; }
pre.out { border-left:3px solid var(--accent); }
table { border-collapse:collapse; display:block; overflow:auto; } td,th { border:1px solid var(--line); padding:5px 10px; text-align:left; }
#menu { display:none; }
@media (max-width: 800px) {
  nav { position:static; width:auto; border:0; border-bottom:1px solid var(--line); max-height:40vh; }
  main { margin-left:0; }
}
</style>
</head>
<body>
<nav>
  <h1>Kova</h1>
  <input id="find" type="search" placeholder="Search the guide…" aria-label="Search the guide">
  <div id="toc"></div>
</nav>
<main id="page">Loading…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const guide = __GUIDE__;
const page = document.getElementById("page"), toc = document.getElementById("toc");
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
page.innerHTML = marked.parse(guide);
// A ```text block after code is that program's output: shown as such.
page.querySelectorAll("pre code.language-text").forEach(c => c.parentElement.classList.add("out"));
const sections = [...page.querySelectorAll("h2")];
sections.forEach(h => { h.id = slug(h.textContent); toc.insertAdjacentHTML("beforeend", `<a href="#${h.id}">${h.textContent}</a>`); });
const links = [...toc.querySelectorAll("a")];
addEventListener("scroll", () => {
  let on = 0; sections.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) on = i; });
  links.forEach((a, i) => a.classList.toggle("on", i === on));
});
// Search: the sections whose text holds every word typed.
document.getElementById("find").addEventListener("input", e => {
  const words = e.target.value.toLowerCase().split(/\s+/).filter(Boolean);
  sections.forEach((h, i) => {
    let text = h.textContent.toLowerCase();
    for (let n = h.nextElementSibling; n && n.tagName !== "H2"; n = n.nextElementSibling) text += " " + n.textContent.toLowerCase();
    links[i].style.display = words.every(w => text.includes(w)) ? "" : "none";
  });
});
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
